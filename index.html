<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>酶科研雷达 · 文献档案馆</title>
<style>

  :root {
    --text-1: #1a1a1a; --text-2: #4d4d4d; --text-3: #7a7a7a; --text-4: #a8a8a8;
    --border: #e4e4e4; --surface: #fff; --surface-mute: #f5f5f5;
    --accent: #2563eb; --positive: #16a34a; --warning: #b45309; --purple: #7c3aed;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --text-1: #e8e8e8; --text-2: #b5b5b5; --text-3: #8a8a8a; --text-4: #606060;
      --border: #333; --surface: #161616; --surface-mute: #1f1f1f;
      --accent: #6ea8fe; --positive: #4ade80; --warning: #fbbf24; --purple: #a78bfa;
    }
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--surface); color: var(--text-1);
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 16px; line-height: 1.6;
  }
  .wrap { max-width: 940px; margin: 0 auto; padding: 32px 24px 80px; }
  .masthead { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px 22px; }
  h1 { font-size: clamp(24px, 4vw, 32px); font-weight: 650; margin: 0; line-height: 1.25; }
  .stats { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 8px; }
  .stat { font-size: 13px; color: var(--text-2); font-variant-numeric: tabular-nums; }
  .stat b { font-weight: 500; color: var(--text-1); }

  .toolbar {
    position: sticky; top: 0; z-index: 20;
    margin: 20px -8px 0; padding: 10px 8px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    border-radius: 0 0 10px 10px;
  }
  .toolbar-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button, input, select, textarea { font: inherit; }
  button:not(:disabled) { cursor: pointer; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  @media (prefers-color-scheme: light) { :root { --positive: #14743b; } }
  #q {
    flex: 1; min-width: 0; padding: 8px 12px;
    border: 1px solid var(--border); border-radius: 10px;
    background: var(--surface); color: var(--text-1);
  }
  #q:focus { border-color: var(--text-3); }
  #week, #mark {
    padding: 8px 12px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--surface); color: var(--text-1);
  }
  .result-bar { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin-top: 14px; font-size: 13px; color: var(--text-2); }
  #count { font-variant-numeric: tabular-nums; }
  #reset { padding: 0; border: 0; background: none; color: var(--accent); }
  .filters { margin-top: 10px; max-height: 34dvh; overflow: auto; padding: 2px 4px 5px; }
  .filter-block { display: flex; align-items: flex-start; gap: 8px; margin-top: 8px; }
  .filter-block:first-child { margin-top: 0; }
  .filter-label { flex: 0 0 52px; font-size: 12px; color: var(--text-3); padding-top: 5px; margin: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; }
  .chip {
    padding: 3px 11px; font-size: 12.5px; cursor: pointer;
    border: 1px solid var(--border); border-radius: 999px;
    background: transparent; color: var(--text-2); line-height: 1.5;
  }
  .chip:hover { border-color: var(--text-3); color: var(--text-1); }
  .chip[aria-pressed="true"] { background: var(--text-1); color: var(--surface); border-color: var(--text-1); }
  .chip .cnt { font-size: 11px; color: var(--text-4); margin-left: 3px; font-variant-numeric: tabular-nums; }
  .chip[aria-pressed="true"] .cnt { color: var(--surface); opacity: .7; }

  .shortcuts, .record-links { display: flex; flex-wrap: wrap; gap: 6px; }
  .shortcuts { margin-top: 14px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    min-height: 34px; padding: 5px 11px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface); color: var(--text-2); text-decoration: none; font-size: 13px; line-height: 1.4;
  }
  .btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .btn[aria-pressed="true"], .primary { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 42%, var(--border)); background: color-mix(in srgb, var(--accent) 8%, var(--surface)); }
  .btn:disabled { opacity: .5; }
  .utility { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 12px; font-size: 13px; }
  .utility summary { cursor: pointer; color: var(--text-2); }
  .record-links { margin: 8px 0 2px; }
  .record-links label { cursor: pointer; }
  .record-links a { color: var(--accent); }
  .file-picker { position: relative; }
  .file-picker:focus-within { outline: 2px solid var(--accent); outline-offset: 3px; }
  #import { position: absolute; inset: 0; width: 100%; opacity: 0; cursor: pointer; }
  .notice { font-size: 13px; color: var(--text-2); margin: 8px 0 0; }
  .notice:empty { margin: 0; }

  .week-head {
    display: flex; align-items: baseline; gap: 10px;
    margin: 20px 0 4px; padding: 6px 12px;
    border-left: 3px solid var(--text-1);
    background: var(--surface-mute);
    border-radius: 0 6px 6px 0;
    scroll-margin-top: 75px;
  }
  .week-head .w { font-size: 15.5px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .week-head .n { font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .week-head .rep { margin-left: auto; font-size: 12px; color: var(--accent); text-decoration: none; }
  .week-head .rep:hover { text-decoration: underline; }

  .entry { padding: 15px 12px; border-bottom: 1px solid var(--border); scroll-margin-top: 80px; }
  .entry:focus-within, .entry:target, .entry.linked { background: color-mix(in srgb, var(--accent) 4%, var(--surface)); }
  .entry.linked { box-shadow: inset 3px 0 var(--accent); }
  .entry-title { font-size: 17px; line-height: 1.45; font-weight: 650; margin: 5px 0 0; }
  .title-button { padding: 0; border: 0; background: none; text-align: left; color: var(--text-1); font: inherit; overflow-wrap: anywhere; }
  .title-button:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
  .entry-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 9px; font-size: 12px; color: var(--text-2); }
  .status-read { color: var(--positive); }
  .key-result { margin: 7px 0 9px; font-size: 14px; color: var(--text-2); overflow-wrap: anywhere; }
  .key-result strong { margin-right: .6em; color: var(--text-1); }
  .cat {
    flex: 0 0 auto; font-size: 12px; line-height: 18px; padding: 0 8px;
    border-radius: 6px; white-space: nowrap; align-self: center;
  }
  .cat-must  { color: var(--accent);   background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .cat-read  { color: var(--positive); background: color-mix(in srgb, var(--positive) 14%, transparent); }
  .cat-watch { color: var(--warning);  background: color-mix(in srgb, var(--warning) 16%, transparent); }
  .cat-hist  { color: var(--purple);   background: color-mix(in srgb, var(--purple) 13%, transparent); }
  .cat-other { color: var(--text-3);   background: color-mix(in srgb, var(--text-3) 14%, transparent); }

  code {
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    font-size: 12px; color: var(--text-2);
    background: var(--surface-mute); padding: 1px 6px; border-radius: 4px;
  }
  .entry-actions, .marks { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
  .entry-actions { margin-top: 9px; }
  .entry-actions .marks { margin-left: auto; }
  .paper-link { color: var(--accent); }
  .mark-btn.on-star { color: var(--warning); border-color: var(--warning); }
  .mark-btn.on-read { color: var(--positive); border-color: var(--positive); }
  .mark-btn.remove-btn { color: var(--warning); }
  .mark-btn.restore-btn { color: var(--positive); }

  .tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .tag {
    font-size: 12px; line-height: 1.5; min-height: 24px; padding: 2px 8px;
    border: 1px solid transparent; border-radius: 6px; background: transparent;
  }
  .tag-d { color: var(--accent); background: color-mix(in srgb, var(--accent) 9%, transparent); }
  .tag-d:hover { background: color-mix(in srgb, var(--accent) 18%, transparent); }
  .tag-m { color: var(--purple); background: color-mix(in srgb, var(--purple) 9%, transparent); }
  .tag-m:hover { background: color-mix(in srgb, var(--purple) 18%, transparent); }
  .tag.on { border-color: currentColor; font-weight: 500; }

  body:has(#reader[open]) { overflow: hidden; }
  #reader {
    width: min(760px, calc(100% - 32px)); max-width: none; max-height: min(90dvh, 960px);
    padding: 0; border: 1px solid var(--border); border-radius: 14px; overflow: hidden;
    background: var(--surface); color: var(--text-1); box-shadow: 0 18px 80px #07182938;
  }
  #reader[open] { display: flex; flex-direction: column; }
  #reader::backdrop { background: #10182088; }
  .reader-bar, .reader-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 20px; }
  .reader-bar { border-bottom: 1px solid var(--border); }
  .reader-nav { border-top: 1px solid var(--border); }
  #reader-count { color: var(--text-2); font-size: 13px; font-variant-numeric: tabular-nums; }
  #reader-body { overflow: auto; overscroll-behavior: contain; padding: 16px 24px 22px; overflow-wrap: anywhere; }
  #reader-title { font-size: clamp(20px, 4vw, 25px); line-height: 1.4; margin: 6px 0 9px; }
  .reader-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
  .reader-key { padding: 12px 15px; background: var(--surface-mute); border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; }
  .reader-fields { margin: 0; }
  .reader-fields dt { font-weight: 650; margin-top: 12px; }
  .reader-fields dt:first-child { margin-top: 0; }
  .reader-fields dd { margin: 3px 0 0; color: var(--text-2); font-size: 15px; line-height: 1.65; white-space: pre-line; }
  .reader-section { padding-top: 13px; margin-top: 13px; border-top: 1px solid var(--border); }
  .reader-section h3 { margin: 0 0 8px; font-size: 16px; }
  .reader-section summary { color: var(--accent); cursor: pointer; }
  .reader-section details .reader-fields { margin-top: 10px; }
  .reader-section a { color: var(--accent); }
  .reader-section p { margin: 8px 0 0; }
  .reader-section label { display: block; font-size: 14px; }
  .reader-section select, .reader-section textarea { border: 1px solid var(--border); border-radius: 8px; padding: 6px 9px; background: var(--surface); color: var(--text-1); }
  .reader-section textarea { display: block; width: 100%; margin-top: 4px; resize: vertical; }

  .empty { padding: 56px 0; text-align: center; color: var(--text-3); font-size: 14px; }
  .foot { margin-top: 40px; font-size: 12px; color: var(--text-2); }

  #top {
    position: fixed; right: 20px; bottom: 20px; z-index: 30;
    padding: 8px 14px; font-size: 12px; cursor: pointer;
    border: 1px solid var(--border); border-radius: 999px;
    background: var(--surface); color: var(--text-2);
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    opacity: 0; pointer-events: none; transition: opacity .2s ease;
  }
  #top.show { opacity: 1; pointer-events: auto; }
  #top:hover { color: var(--text-1); border-color: var(--text-3); }

  @media (max-width: 640px) {
    .wrap { padding: 22px 14px 76px; }
    .entry { padding-inline: 5px; }
    .entry-actions .marks { margin-left: 0; }
    .filter-label { flex-basis: 44px; }
    .btn { min-height: 38px; }
    .tag { min-height: 27px; }
    #reader { width: 100%; height: 100dvh; max-height: none; margin: 0; border: 0; border-radius: 0; }
    #reader-body { flex: 1; padding: 13px 14px 18px; }
    .reader-bar, .reader-nav { padding: 8px 14px; }
  }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>
</head>
<body>
<main class="wrap">
  <header class="masthead">
    <div><h1>酶科研雷达</h1><div class="stats" id="stats"></div></div>
    <a class="btn primary" id="current-report" hidden>最新周报 →</a>
  </header>

  <div class="toolbar">
    <div class="toolbar-top">
      <input id="q" type="search" placeholder="搜索标题、DOI、结果、标签或笔记" aria-label="搜索文献">
      <button class="btn" id="toggle" aria-controls="filters" aria-expanded="false">筛选</button>
    </div>
    <div class="filters" id="filters" hidden>
      <div class="filter-block">
        <p class="filter-label">范围</p>
        <div class="chips">
          <select id="week" aria-label="按周筛选"></select>
          <select id="mark" aria-label="按标记筛选">
            <option value="全部">全部标记</option>
            <option value="精读">我的收藏 ★</option>
            <option value="未读">仅未读</option>
          </select>
        </div>
      </div>
      <div class="filter-block">
        <p class="filter-label">处置</p>
        <div class="chips" id="cats" aria-label="按处置筛选"></div>
      </div>
      <div class="filter-block">
        <p class="filter-label">研究方向</p>
        <div class="chips" id="dirs" aria-label="按研究方向筛选"></div>
      </div>
      <div class="filter-block">
        <p class="filter-label">研究方法</p>
        <div class="chips" id="meths" aria-label="按研究方法筛选"></div>
      </div>
    </div>
  </div>

  <div class="shortcuts" id="shortcuts" role="group" aria-label="快速筛选">
    <button class="btn" data-mode="all">全部</button>
    <button class="btn" data-mode="latest-must">本期必读</button>
    <button class="btn" data-mode="latest">最近收录</button>
    <button class="btn" data-mode="unread">必读未读</button>
    <button class="btn" data-mode="star">我的收藏</button>
    <button class="btn" data-mode="notes">有笔记</button>
    <button class="btn" data-mode="removed">已删除 (0)</button>
  </div>
  <div class="utility">
    <details><summary>往期周报</summary><nav id="weeknav" class="record-links" aria-label="往期周报"></nav></details>
    <details><summary>备份阅读记录</summary><div class="record-links"><button class="btn" id="export">导出记录</button><label class="btn file-picker">导入记录 <input id="import" type="file" accept="application/json"></label></div></details>
  </div>
  <p class="notice" id="notice" role="status"></p>
  <div class="result-bar"><span id="count" role="status"></span><button id="reset" hidden>清空筛选</button></div>
  <section id="list" aria-label="文献列表"></section>

  <footer class="foot">收藏、阅读进度、笔记和删除状态保存在当前浏览器。可在“已删除”恢复文献。</footer>
</main>
<button id="top" aria-label="回到顶部">↑ 顶部</button>

<dialog id="reader" aria-labelledby="reader-title">
  <header class="reader-bar"><span id="reader-count"></span><button class="btn" id="reader-close" aria-label="关闭阅读，返回列表">返回列表 ×</button></header>
  <div id="reader-body"></div>
  <nav class="reader-nav" aria-label="连续阅读">
    <button class="btn" id="reader-prev">← 上一篇</button>
    <button class="btn primary" id="reader-next">下一篇 →</button>
  </nav>
</dialog>

    "detail": "论文题名\nEnzymatic oxidative esterification with an unconventional regioselective control\n\n主要内容\n以结构指导工程将醛脱氢酶改造成氧化酯合酶。OxiEs1偏好伯醇且依赖咪唑，OxiEs2偏好仲醇且无需咪唑，展示多底物酯化及制备应用。\n\n创新点\n通过蛋白改造与咪唑条件调控活性位点几何，获得对伯醇和仲醇互补的区域选择性。\n\n价值与局限\n适合学习序列与反应条件联合优化。适用底物、咪唑作用和制备性能依赖具体体系，采用前需核对动力学与底物范围。\n\n证据依据\nPubMed官方摘要\n\n研究设计与方法\n研究从醛脱氢酶出发，以结构指导工程并结合咪唑反应条件开发氧化酯化酶；作者比较不同醇底物类型与两种酶的条件依赖性。\n\n关键结果与测量口径\n摘要报告OxiEs1偏好伯醇且依赖咪唑，OxiEs2偏好仲醇且不依赖咪唑，并展示多底物酯化和制备应用；当前审阅范围未核库规模、动力学倍数或统一对照。\n\n研究用途与核查重点\n可借鉴把酶序列与反应条件共同作为选择性变量；进一步阅读全文后，应在同一底物/条件矩阵核对转化率、区域异构体和重复，再判断其范围是否适合目标合成。",

    "detail": "论文题名\nCross-family learning transfers thermal adaptation between enzymes\n\n主要内容\nTHOR用非配对嗜中温与嗜热序列学习背景相关的序列变换，在跨家族迁移及被排除训练的苹果酸脱氢酶上测试热适应，并分析活性保持与构象变化。\n\n创新点\n尝试把不同进化谱系的热适应信息迁移到缺少嗜热同源物的目标蛋白，同时保持起始蛋白身份。\n\n价值与局限\n可作为跨家族稳定性设计候选。官方摘要的熔点增量单位缺失，本次不引用该数值；家族覆盖、活性保留比例及同预算基线仍待全文核查。\n\n证据依据\nbioRxiv官方摘要\n\n研究设计与方法\nTHOR从非配对嗜中温与嗜热酶序列学习依赖蛋白背景的序列变换，并用于跨家族热适应迁移；测试包括训练中排除的苹果酸脱氢酶及活性保持。\n\n关键结果与测量口径\n留出的苹果酸脱氢酶案例中，作者报告零样本设计提高表观熔解温度，有限微调后增幅更大。多数设计经热处理后仍有活性，个别变体周转接近 WT 的 3 倍。具体样本分母和条件待全文。\n\n研究用途与核查重点\n可用来审阅跨家族稳定化设计思路。阅读正文时核对家族隔离、表观熔解温度的测定与热处理条件，同时检查剩余活性和周转，避免把保留活性和提高本征活性混为一项。",

    "detail": "论文题名\npdb2reaction: End-to-End Reaction-Path Elucidation from PDB Structures Using Machine-Learning Interatomic Potentials\n\n主要内容\npdb2reaction从用户整理的PDB构建活性位点簇模型，衔接MLIP路径搜索、过渡态精修、IRC和热化学。作者在6种酶的23步反应中，使用UMA-m-1.1重现19步文献机理。\n\n创新点\n把PDB到多步反应路径的计算整合为可续跑工具，并提供递归搜寻中间体及GPU Hessian/IRC计算。\n\n价值与局限\n适合作为机理探索初筛。其QRRHO自由能属于截断簇模型，长程环境和全酶构象采样需另外处理，目标体系仍需DFT或QM/MM校准。 期刊首次在线为2026-10-07，10-27是卷期日期。\n\n证据依据\n期刊摘要及Methods 2.1/2.4、Results 3.1段落\n\n研究设计与方法\npdb2reaction由整理后的PDB构建活性位点簇，串接机器学习原子势路径搜索、过渡态精修、IRC与热化学；结果段评估UMA-m-1.1在多酶多步反应中的机理再现。\n\n关键结果与测量口径\n作者在6种酶、23步反应中以UMA-m-1.1重现19步文献机理；分母是反应步骤，评价为机理路径一致性，不等同于全酶条件下的自由能精度或催化活性预测。\n\n研究用途与核查重点\n可用于从结构提出候选反应路径并安排后续计算；使用前需检查簇截断、质子化和未再现的4步，再对目标体系用DFT或QM/MM及不同构象校准，不能把簇模型能垒直接当实验速率。",

    "detail": "论文题名\nImproved Biosynthesis of Ethylene Glycol From Xylose in Engineered E. coli Utilizing Two-Stage Dynamic Control\n\n主要内容\n磷限制后启动 Dahms 途径。基础株减少竞争反应提高比生产率。路线优化后改善 NADPH 供给的调控更有利。补料发酵报告 70 h 达 140 g/L。\n\n创新点\n比较两阶段动态代谢阀在不同路径能力下的效应。\n\n价值与局限\n木糖途径、产物和调控背景限定迁移。整株滴度属于联合工程与生产过程结果。\n\n证据依据\nBiotechnology Journal 官方在线日期及摘要。\n\n研究设计与方法\n将 E. coli 的增长期与生产期分开，以磷耗竭启动 Dahms 木糖路线。作者比较减少竞争支路的化学计量调控与促进 NADPH 供给的调控，并在基础及途径优化株中分别验证。\n\n关键结果与测量口径\n摘要报告基础株的比生产率因减少竞争提升约三倍。优化后调节 NADPH 更有利，比生产率大于 0.5 g·gCDW⁻¹·h⁻¹、约为对照 14 倍。罐试最终收率 0.38 g/g 木糖。\n\n研究用途与核查重点\n可借鉴先确定瓶颈随途径增强而变化，再决定支路或辅因子改造的比较顺序。目标路径需分别核对生产期生物量、培养条件和碳收率，避免以最终滴度分解单一改造。",

      "innovation": "比较两阶段动态代谢阀在不同路径能力下的效应。",
      "limitations": "木糖途径、产物和调控背景限定迁移。整株滴度属于联合工程与生产过程结果。",

      "source": "https://onlinelibrary.wiley.com/doi/10.1002/biot.70329",
      "method": "将 E. coli 的增长期与生产期分开，以磷耗竭启动 Dahms 木糖路线。作者比较减少竞争支路的化学计量调控与促进 NADPH 供给的调控，并在基础及途径优化株中分别验证。",
      "results": "摘要报告基础株的比生产率因减少竞争提升约三倍。优化后调节 NADPH 更有利，比生产率大于 0.5 g·gCDW⁻¹·h⁻¹、约为对照 14 倍。罐试最终收率 0.38 g/g 木糖。",
      "application": "可借鉴先确定瓶颈随途径增强而变化，再决定支路或辅因子改造的比较顺序。目标路径需分别核对生产期生物量、培养条件和碳收率，避免以最终滴度分解单一改造。",
      "highlight": "动态调节 NADPH 的优化菌株中，乙二醇比生产率超过 0.5 g·gCDW⁻¹·h⁻¹，约为对照 14 倍。发酵罐的木糖到乙二醇收率为 0.38 g/g。"

<script>
var REPORTS = {"2026-09-30":"reports/weekly_2026-09-30.html","2026-10-05":"reports/weekly_2026-10-05.html","2026-10-12":"reports/weekly_2026-10-12.html","2026-10-19":"reports/weekly_2026-10-19.html","2026-10-26":"reports/weekly_2026-10-26.html","2026-11-02":"reports/weekly_2026-11-02.html","2026-11-09":"reports/weekly_2026-11-09.html","2026-11-12":"reports/weekly_2026-11-12.html","2026-11-17":"reports/weekly_2026-11-17.html"};
(function () {
  var DATA = JSON.parse(document.getElementById('radar-data').textContent);
  var CAT_ORDER = ['必读', '可读', '观察', '历史补课', '其他', '忽略'];
  var CAT_CLASS = { '必读': 'cat-must', '可读': 'cat-read', '观察': 'cat-watch', '历史补课': 'cat-hist', '其他': 'cat-other', '忽略': 'cat-other' };
  var DIR_ORDER = ['活性与动力学','酶动力学参数预测','热稳定性','溶解度与表达','耐受与转运','选择性与特异性','新酶与新功能设计','酶挖掘','高通量筛选','通路组装与产量','结构与构象','底物结合与口袋','功能注释与预测','基准与方法学'];
  var METH_ORDER = ['AI/ML 模型','物理模拟','定向进化与筛选','理性与半理性设计','实验表征','数据库与工具','综述与批评'];
  var defaults = { q: '', cat: '全部', week: '全部', dir: '全部', meth: '全部', mark: '全部' };
  var state = Object.assign({}, defaults);

  // ---- marks (localStorage) ----
  var MKEY = 'radar-marks-v1';
  var mode='all'; var marks = {};
  try { marks = JSON.parse(localStorage.getItem(MKEY) || '{}'); } catch (e) { marks = {}; }
  function saveMarks() { try { localStorage.setItem(MKEY, JSON.stringify(marks)); return true; } catch (e) { return false; } }
  function removedCount() { return DATA.filter(function(e){ return marks[e.id] && marks[e.id].removed; }).length; }

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function linkFor(id) {
    var m = id.match(/arXiv:(\S+)/i);
    if (m) return 'https://arxiv.org/abs/' + m[1].replace(/[，。（）()、\s].*$/, '');
    if (/^\d{4}\.\d{4,5}$/.test(id)) return 'https://arxiv.org/abs/' + id;
    m = id.match(/^(?:PubMed|PMID)[:\s]*(\d{6,9})/i);
    if (m) return 'https://pubmed.ncbi.nlm.nih.gov/' + m[1] + '/';
    m = id.match(/^(PMC\d{5,9})/i);
    if (m) return 'https://www.ncbi.nlm.nih.gov/pmc/articles/' + m[1] + '/';
    m = id.match(/preprints\.org\s*(\d{6}\.\d{4,5})/i);
    if (m) return 'https://www.preprints.org/manuscript/' + m[1];
    m = id.match(/^(rs-\d{6,9})/i);
    if (m) return 'https://www.researchsquare.com/article/' + m[1] + '/v1';
    m = id.match(/^Zenodo\s*(\d{5,9})/i);
    if (m) return 'https://doi.org/10.5281/zenodo.' + m[1];
    m = id.match(/^ScienceDirect\s*(S\d{15,17})/i);
    if (m) return 'https://www.sciencedirect.com/science/article/pii/' + m[1];
    var first = id.split(/[\s（(]/)[0];
    if (/^10\.\d{4,}\/\S+$/.test(first)) return 'https://doi.org/' + first;
    return null;
  }
  function count(listKey, key) {
    var n = 0;
    DATA.forEach(function (e) { if ((listKey === 'cat' ? [e.cat] : e[listKey]).indexOf(key) !== -1) n++; });
    return n;
  }

  // ---- stats ----
  var weeks = {}, must = 0;
  DATA.forEach(function (e) { weeks[e.week] = true; if (e.cat === '必读') must++; });
  var weekList = Object.keys(weeks).sort().reverse();
  var reportDates = Object.keys(REPORTS).sort().reverse();
  var latestReport = reportDates[0] || weekList[0];
  var presets = {
    all: {}, 'latest-must': { week: latestReport, cat: '必读' }, latest: { week: weekList[0] },
    unread: { cat: '必读', mark: '未读' }, star: { mark: '精读' }, notes: {}, removed: {}
  };
  var weekChoices = Array.from(new Set(weekList.concat(reportDates))).sort().reverse();
  var currentReport = document.getElementById('current-report');
  if (REPORTS[latestReport]) {
    currentReport.href = REPORTS[latestReport];
    currentReport.textContent = '最新周报 · ' + latestReport.slice(5) + ' →';
    currentReport.hidden = false;
  }
  function updateStats() {
    document.getElementById('stats').innerHTML =
      '<span class="stat"><b>' + DATA.length + '</b> 篇文献</span>' +
      '<span class="stat"><b>' + must + '</b> 篇必读</span>' +
      '<span class="stat"><b>' + reportDates.length + '</b> 期周报</span>';
  }
  updateStats();

  var sel = document.getElementById('week');
  sel.innerHTML = '<option value="全部">全部周期</option>' + weekChoices.map(function (w) {
    return '<option value="' + esc(w) + '">' + esc(w) + ' 期</option>';
  }).join('');
  sel.addEventListener('change', function () { state.week = sel.value; render(); });

  document.getElementById('mark').addEventListener('change', function (ev) {
    state.mark = ev.target.value; render();
  });

  document.getElementById('weeknav').innerHTML = reportDates.map(function (w) {
    return '<a class="btn" href="' + esc(REPORTS[w]) + '">' + esc(w) + '</a>';
  }).join('');

  var tg = document.getElementById('toggle'), fl = document.getElementById('filters');
  tg.addEventListener('click', function () {
    fl.hidden = !fl.hidden;
    tg.textContent = fl.hidden ? '筛选' : '收起筛选';
    tg.setAttribute('aria-expanded', String(!fl.hidden));
  });

  function buildChips(elId, names, dim, listKey) {
    var el = document.getElementById(elId);
    var all = ['全部'].concat(names.filter(function (n) {
      return DATA.some(function (e) { return (listKey === 'cat' ? [e.cat] : e[listKey]).indexOf(n) !== -1; });
    }));
    el.innerHTML = all.map(function (n) {
      var cnt = n === '全部' ? '' : '<span class="cnt">' + count(listKey, n) + '</span>';
      return '<button class="chip" aria-pressed="' + (n === '全部') + '" data-v="' + esc(n) + '">' + esc(n) + cnt + '</button>';
    }).join('');
    el.addEventListener('click', function (ev) {
      var b = ev.target.closest('button[data-v]');
      if (!b) return;
      setFilter(dim, b.getAttribute('data-v'));
    });
  }
  function setFilter(dim, v) {
    state[dim] = (state[dim] === v) ? '全部' : v;
    syncChips();
    render();
  }
  function syncChips() {
    [['cats', 'cat'], ['dirs', 'dir'], ['meths', 'meth']].forEach(function (p) {
      document.getElementById(p[0]).querySelectorAll('button').forEach(function (x) {
        x.setAttribute('aria-pressed', String(x.getAttribute('data-v') === state[p[1]]));
      });
    });
  }
  buildChips('cats', CAT_ORDER, 'cat', 'cat');
  buildChips('dirs', DIR_ORDER, 'dir', 'dirs');
  buildChips('meths', METH_ORDER, 'meth', 'meths');

  document.getElementById('q').addEventListener('input', function (ev) {
    state.q = searchText(ev.target.value.trim());
    render();
  });

  function searchText(value) {
    return value.normalize('NFKC').toLowerCase();
  }
  var searchAliases = { '糖基转移酶': 'ugt', 'ugt': '糖基转移酶', '溶解度': 'solubility', 'solubility': '溶解度' };
  var searchIndex = new Map(DATA.map(function (e) {
    var review = e.review || {};
    return [e.id, searchText([
      e.title, e.id, e.display_id, e.disp, e.detail, review.title, review.content,
      review.method, review.highlight, review.results, review.innovation, review.application, review.limitations,
      e.dirs.join(' '), e.meths.join(' ')
    ].join(' '))];
  }));

  function match(e) {
    var removed = !!(marks[e.id] && marks[e.id].removed);
    if (mode === 'removed' ? !removed : removed) return false;
    if (mode === 'notes' && !(marks[e.id] && marks[e.id].note)) return false;
    if (state.cat !== '全部' && e.cat !== state.cat) return false;
    if (state.week !== '全部' && e.week !== state.week) return false;
    if (state.dir !== '全部' && e.dirs.indexOf(state.dir) === -1) return false;
    if (state.meth !== '全部' && e.meths.indexOf(state.meth) === -1) return false;
    if (state.mark === '精读' && !(marks[e.id] && marks[e.id].star)) return false;
    if (state.mark === '未读' && (marks[e.id] && marks[e.id].read)) return false;
    if (state.q) {
      var hay = searchIndex.get(e.id) + ' ' + searchText(marks[e.id]?.note || '');
      return state.q.split(/\s+/).every(function (term) {
        return hay.includes(term) || (searchAliases[term] && hay.includes(searchAliases[term]));
      });
    }
    return true;
  }

  function tagHtml(e) {
    var h = '<div class="tags">';
    e.dirs.forEach(function (t) {
      h += '<button class="tag tag-d' + (state.dir === t ? ' on' : '') + '" data-dim="dir" data-tag="' + esc(t) + '">' + esc(t) + '</button>';
    });
    e.meths.forEach(function (t) {
      h += '<button class="tag tag-m' + (state.meth === t ? ' on' : '') + '" data-dim="meth" data-tag="' + esc(t) + '">' + esc(t) + '</button>';
    });
    return h + '</div>';
  }

  var listEl = document.getElementById('list');
  var reader = document.getElementById('reader');
  var readerBody = document.getElementById('reader-body');
  var prev = document.getElementById('reader-prev');
  var next = document.getElementById('reader-next');
  var visibleEntries = [], readerQueue = [], readerIndex = 0, readerOrigin;

  function openButton(e, label, css) {
    return '<button type="button" class="' + css + '" data-open="' + esc(e.id) + '">' + esc(label) + '</button>';
  }

  function paperUrl(e) {
    return e.source_url || linkFor(e.id) || e.review?.source;
  }

  function externalLink(url, label, css) {
    if (!/^https?:\/\//i.test(url)) return '';
    return '<a class="' + (css || '') + '" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(label) + ' ↗</a>';
  }

  function markButtons(e, includeRead) {
    var mk = marks[e.id] || {};
    var attr = ' data-id="' + esc(e.id) + '" data-kind="';
    return '<span class="marks">' +
      '<button class="btn mark-btn' + (mk.star ? ' on-star' : '') + '"' + attr + 'star" aria-label="收藏" aria-pressed="' + !!mk.star + '">' + (mk.star ? '★ 已收藏' : '☆ 收藏') + '</button>' +
      (includeRead ? '<button class="btn mark-btn' + (mk.read ? ' on-read' : '') + '"' + attr + 'read" aria-label="标为已读" aria-pressed="' + !!mk.read + '">' + (mk.read ? '✓ 已读' : '标为已读') + '</button>' : '') +
      (mk.removed ? '<button class="btn mark-btn restore-btn"' + attr + 'restore">恢复</button>' : '<button class="btn mark-btn remove-btn"' + attr + 'remove">删除</button>') +
      '</span>';
  }

  function entryNode(id) {
    return document.getElementById('entry-' + encodeURIComponent(id));
  }

  function changeMark(button, inReader) {
    var id = button.dataset.id, kind = button.dataset.kind;
    var mk = marks[id] || {};
    if (kind === 'remove') {
      var item = DATA.find(function (e) { return e.id === id; });
      if (!window.confirm('将“' + item.title + '”从当前浏览器的文献列表删除？\n\n可在“已删除”中恢复，个人笔记会保留。')) return;
      mk.removed = true;
      mk.removedAt = new Date().toISOString();
    } else if (kind === 'restore') {
      delete mk.removed;
      delete mk.removedAt;
    } else {
      mk[kind] = !mk[kind];
      if (kind === 'read') mk.status = mk.read ? '已读' : '待读';
    }
    if (mk.star || mk.read || mk.note || mk.status || mk.removed) marks[id] = mk;
    else delete marks[id];
    var saved = saveMarks();
    var message = !saved ? '本机存储失败，请导出记录备份。' :
      kind === 'remove' ? '已从主列表删除。可在“已删除”中恢复。' :
      kind === 'restore' ? '已恢复到文献列表。' : '阅读记录已更新。';
    render();
    if (inReader) {
      var actions = reader.querySelector('.reader-marks');
      actions.innerHTML = markButtons(readerQueue[readerIndex], true);
      reader.querySelector('.progress').value = readingStatus(mk);
      var replacement = actions.querySelector('[data-kind="' + kind + '"]') || reader.querySelector('#reader-title');
      replacement.focus({ preventScroll: true });
      readerNotify(message);
    } else {
      var card = entryNode(id);
      var replacement = card && (card.querySelector('[data-kind="' + kind + '"]') || card.querySelector('.title-button'));
      (replacement || document.querySelector('#shortcuts [aria-pressed="true"]') || document.getElementById('q')).focus({ preventScroll: true });
    }
    notify(message);
  }

  listEl.addEventListener('click', function (ev) {
    var b = ev.target.closest('button.tag');
    if (b) {
      var cardId = b.closest('.entry').id;
      setFilter(b.dataset.dim, b.dataset.tag);
      var card = document.getElementById(cardId);
      var sameTag = card && Array.from(card.querySelectorAll('button.tag')).find(function (tag) {
        return tag.dataset.dim === b.dataset.dim && tag.dataset.tag === b.dataset.tag;
      });
      (sameTag || document.getElementById('q')).focus({ preventScroll: true });
      return;
    }
    var mb = ev.target.closest('button.mark-btn');
    if (mb) { changeMark(mb, false); return; }
    var open = ev.target.closest('button[data-open]');
    if (open) {
      readerQueue = visibleEntries.slice();
      readerIndex = readerQueue.findIndex(function (e) { return e.id === open.dataset.open; });
      if (readerIndex < 0) return;
      readerOrigin = { id: open.dataset.open, title: open.classList.contains('title-button') };
      renderReader();
      reader.showModal();
      reader.querySelector('#reader-title').focus({ preventScroll: true });
    }
  });

  function fieldList(fields) {
    var items = fields.filter(function (field) { return field[1]; }).map(function (field) {
      return '<dt>' + field[0] + '</dt><dd>' + esc(field[1]) + '</dd>';
    });
    return items.length ? '<dl class="reader-fields">' + items.join('') + '</dl>' : '';
  }

  function readingStatus(mk) {
    return mk.read ? '已读' : (mk.status || '待读');
  }

  function renderReader() {
    var e = readerQueue[readerIndex], review = e.review || {}, mk = marks[e.id] || {};
    var url = paperUrl(e);
    var key = fieldList([
      ['关键结果', review.highlight || review.results], ['研究用途与核查重点', review.application],
      ['价值与局限', review.limitations], ['证据依据', review.scope]
    ]);
    var measurements = review.highlight && review.results && review.highlight !== review.results
      ? '<div class="reader-section"><details><summary>数据与测量口径</summary>' +
        fieldList([['详细结果', review.results]]) + '</details></div>'
      : '';
    var method = fieldList([
      ['主要内容', review.content || e.detail || e.disp],
      ['研究设计与方法', review.method], ['创新点', review.innovation]
    ]);
    var evidence = '';
    if (review.source !== url) evidence += externalLink(review.source, '核查来源');
    if (review.additional_source !== url && review.additional_source !== review.source) {
      evidence += (evidence ? ' · ' : '') + externalLink(review.additional_source, '补充核查来源');
    }
    var options = ['待读', '阅读中', '已读'].map(function (value) {
      return '<option' + (readingStatus(mk) === value ? ' selected' : '') + '>' + value + '</option>';
    }).join('');
    readerBody.innerHTML =
      '<div class="entry-meta"><span class="cat ' + (CAT_CLASS[e.cat] || 'cat-other') + '">' + esc(e.cat) + '</span><span>' + esc(e.week) + ' 期</span></div>' +
      '<h2 id="reader-title" tabindex="-1">' + esc(e.title) + '</h2>' +
      (review.title && review.title !== e.title ? '<div>' + esc(review.title) + '</div>' : '') +
      '<div class="entry-meta"><code>' + esc(e.display_id || e.id) + '</code><span>收录 ' + esc(e.date) + '</span></div>' +
      '<div class="reader-actions">' + externalLink(url, e.link_label || '打开原文', 'btn primary paper-link') +
        '<span class="reader-marks">' + markButtons(e, true) + '</span><button class="btn" data-note>笔记 ↓</button></div>' +
      (key ? '<section class="reader-key" aria-label="重点速览">' + key + '</section>' : '') +
      measurements +
      (method ? '<section class="reader-section" aria-label="文献详情">' + method + '</section>' : '') +
      (evidence ? '<div class="reader-section">' + evidence + '</div>' : '') +
      '<section class="reader-section" aria-labelledby="reader-record"><h3 id="reader-record">我的阅读记录</h3>' +
      '<label>阅读进度 <select class="progress">' + options + '</select></label>' +
      '<p><label>笔记<textarea class="note" rows="4" placeholder="要点、疑问或下一步">' + esc(mk.note || '') + '</textarea></label></p>' +
      '<p class="notice" id="reader-notice" role="status"></p></section>';
    document.getElementById('reader-count').textContent = '筛选结果 · ' + (readerIndex + 1) + ' / ' + readerQueue.length;
    prev.disabled = readerIndex === 0;
    next.disabled = readerIndex === readerQueue.length - 1;
    readerBody.scrollTop = 0;
  }

  function moveReader(step) {
    var index = readerIndex + step;
    if (index < 0 || index >= readerQueue.length) return;
    readerIndex = index;
    renderReader();
    reader.querySelector('#reader-title').focus({ preventScroll: true });
  }

  function readerNotify(message) {
    var status = document.getElementById('reader-notice');
    if (status.textContent !== message) status.textContent = message;
  }

  document.getElementById('reader-close').onclick = function () { reader.close(); };
  prev.onclick = function () { moveReader(-1); };
  next.onclick = function () { moveReader(1); };
  reader.addEventListener('close', function () {
    var card = entryNode(readerOrigin.id);
    var opener = card && card.querySelector(readerOrigin.title ? '.title-button' : '.details-button');
    (opener || document.getElementById('q')).focus({ preventScroll: true });
  });
  reader.addEventListener('keydown', function (ev) {
    if ((ev.key !== 'ArrowLeft' && ev.key !== 'ArrowRight') || ev.altKey || ev.ctrlKey || ev.metaKey || ev.shiftKey ||
        ev.target.closest('input, textarea, select, [contenteditable]') || window.getSelection()?.toString()) return;
    ev.preventDefault();
    moveReader(ev.key === 'ArrowLeft' ? -1 : 1);
  });
  readerBody.addEventListener('click', function (ev) {
    var button = ev.target.closest('button.mark-btn');
    if (button) changeMark(button, true);
    if (ev.target.closest('button[data-note]')) readerBody.querySelector('.note').focus();
  });
  readerBody.addEventListener('input', function (ev) {
    var input = ev.target;
    if (!input.matches('.note,.progress')) return;
    var id = readerQueue[readerIndex].id;
    var mk = marks[id] || (marks[id] = {});
    if (input.matches('.note')) mk.note = input.value;
    else {
      mk.status = input.value;
      mk.read = input.value === '已读';
      reader.querySelector('.reader-marks').innerHTML = markButtons(readerQueue[readerIndex], true);
    }
    mk.updatedAt = new Date().toISOString();
    readerNotify(saveMarks() ? '已保存到当前浏览器。' : '保存失败，请导出记录备份。');
    render();
  });

  function renderCard(e) {
    var mk = marks[e.id] || {};
    var status = readingStatus(mk);
    var result = e.review?.highlight || e.review?.results;
    var preview = result || e.review?.content || e.disp || e.detail || '';
    return '<article class="entry" id="entry-' + encodeURIComponent(e.id) + '">' +
      '<div class="entry-meta"><span class="cat ' + (CAT_CLASS[e.cat] || 'cat-other') + '">' + esc(e.cat) + '</span>' +
      (status !== '待读' ? '<span class="' + (mk.read ? 'status-read' : '') + '">' + esc(status) + '</span>' : '') +
      (mk.note ? '<span>有笔记</span>' : '') + '</div>' +
      '<h3 class="entry-title">' + openButton(e, e.title, 'title-button') + '</h3>' +
      (preview ? '<p class="key-result"><strong>' + (result ? '关键结果' : '主要内容') + '</strong>' + esc(preview) + '</p>' : '') +
      tagHtml(e) +
      '<div class="entry-actions">' + openButton(e, '阅读详情', 'btn primary details-button') +
      externalLink(paperUrl(e), '原文', 'btn paper-link') + markButtons(e, false) + '</div></article>';
  }

  function render() {
    var removedButton = document.querySelector('#shortcuts button[data-mode="removed"]');
    removedButton.textContent = '已删除 (' + removedCount() + ')';
    document.querySelectorAll('#shortcuts button[data-mode]').forEach(function (button) {
      var chosen = button.dataset.mode === mode && Object.keys(defaults).every(function (key) {
        return state[key] === (presets[mode][key] ?? defaults[key]);
      });
      button.setAttribute('aria-pressed', String(chosen));
    });

    var byWeek = {};
    DATA.forEach(function (e) {
      if (!match(e)) return;
      if (!byWeek[e.week]) byWeek[e.week] = [];
      byWeek[e.week].push(e);
    });
    var groups = Object.keys(byWeek).sort().reverse();
    visibleEntries = groups.flatMap(function (w) { return byWeek[w]; });
    var filterLabels = ['week', 'cat', 'dir', 'meth', 'mark'].map(function (key) {
      return state[key];
    }).filter(function (value) { return value !== '全部'; });
    var countEl = document.getElementById('count');
    var countText = '显示 ' + visibleEntries.length + ' / ' + DATA.length + ' 篇' +
      (filterLabels.length ? ' · ' + filterLabels.join(' / ') : '');
    if (countEl.textContent !== countText) countEl.textContent = countText;
    document.getElementById('reset').hidden = mode === 'all' && !state.q && !filterLabels.length;

    if (!groups.length) {
      var message = mode === 'removed' && !removedCount() ? '目前没有已删除的文献。' :
        mode === 'latest-must' && !state.q && filterLabels.length === 2 ? '本期暂无可显示的必读文献，可查看最新周报。' :
        '没有匹配的文献。试试清空筛选或换一个关键词。';
      listEl.innerHTML = '<div class="empty">' + message + '</div>';
      return;
    }

    listEl.innerHTML = groups.map(function (w) {
      var items = byWeek[w];
      var rep = REPORTS[w] ? '<a class="rep" href="' + esc(REPORTS[w]) + '">当期周报 →</a>' : '';
      return '<h2 class="week-head" id="w-' + esc(w) + '"><span class="w">' + esc(w) + ' 期</span><span class="n">' + items.length + ' 篇</span>' + rep + '</h2>' +
        items.map(renderCard).join('');
    }).join('');
  }

  var topBtn = document.getElementById('top');
  window.addEventListener('scroll', function () {
    topBtn.classList.toggle('show', window.scrollY > 600);
  }, { passive: true });
  topBtn.addEventListener('click', function () { window.scrollTo({ top: 0, behavior: 'smooth' }); });

  function notify(t) { document.getElementById('notice').textContent = t; }

  function setMode(value) {
    mode = value;
    Object.assign(state, defaults, presets[value]);
    document.getElementById('q').value = '';
    sel.value = state.week;
    document.getElementById('mark').value = state.mark;
    syncChips();
    notify('');
    render();
  }

  document.getElementById('shortcuts').addEventListener('click', function (ev) {
    var shortcut = ev.target.closest('[data-mode]');
    if (shortcut) setMode(shortcut.dataset.mode);
  });
  document.getElementById('reset').onclick = function () {
    setMode('all');
    document.getElementById('q').focus();
  };
  document.getElementById('export').onclick=function(){var blob=new Blob([JSON.stringify({version:1,marks:marks},null,2)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='radar-records-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(function(){URL.revokeObjectURL(a.href);},1000);};
  document.getElementById('import').onchange=async function(ev){try{var f=ev.target.files[0];if(!f)return;if(f.size>5000000)throw Error('文件过大');var d=JSON.parse(await f.text());if(d.version!==1 || !d.marks || typeof d.marks!=='object' || Array.isArray(d.marks))throw Error('格式错误');var next=JSON.parse(JSON.stringify(marks));Object.keys(d.marks).forEach(function(id){var v=d.marks[id];if(!DATA.some(function(e){return e.id===id;}))return;if(!v || typeof v!=='object')throw Error('记录错误');if(v.note!==undefined && typeof v.note!=='string')throw Error('笔记格式错误');if(v.status && !['待读','阅读中','已读'].includes(v.status))throw Error('进度格式错误');if(v.removed!==undefined && typeof v.removed!=='boolean')throw Error('移除状态格式错误');if(!next[id])next[id]={star:!!v.star,read:!!v.read,note:v.note||'',status:v.status||'',updatedAt:v.updatedAt||''};if(v.removed===true)next[id].removed=true;});localStorage.setItem(MKEY,JSON.stringify(next));marks=next;render();notify('导入完成；已有记录保留，新增记录已合并。');}catch(e){notify('导入失败：'+e.message);}ev.target.value='';};
  function locate() {
    listEl.querySelector('.linked')?.classList.remove('linked');
    if (!location.hash.startsWith('#entry-')) return;
    var anchor = location.hash.slice(1);
    if (!document.getElementById(anchor)) setMode('all');
    var entry = document.getElementById(anchor);
    if (entry) {
      entry.classList.add('linked');
      entry.scrollIntoView();
    }
  }
  window.addEventListener('hashchange',locate);
  render();locate();
})();
</script>
</body>
</html>
