<title>酶科研雷达 · 文献档案馆</title>
<style>

  :root {
    --text-1: #1a1a1a; --text-2: #4d4d4d; --text-3: #7a7a7a; --text-4: #a8a8a8;
    --border: #e4e4e4; --surface: #fff; --surface-mute: #f5f5f5;
    --accent: #2563eb; --positive: #16a34a; --warning: #b45309; --purple: #7c3aed;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --text-1: #e8e8e8; --text-2: #b5b5b5; --text-3: #8a8a8a; --text-4: #606060;
      --border: #333; --surface: #161616; --surface-mute: #1f1f1f;
      --accent: #6ea8fe; --positive: #4ade80; --warning: #fbbf24; --purple: #a78bfa;
    }
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--surface); color: var(--text-1);
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 16px; line-height: 1.6;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 28px 20px 80px; }

  h1 { font-size: 22px; font-weight: 500; margin: 0; letter-spacing: 0; }
  .sub { color: var(--text-3); font-size: 13px; margin-top: 6px; }
  .stats { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 14px; }
  .stat { font-size: 13px; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .stat b { font-weight: 500; color: var(--text-1); }

  .toolbar {
    position: sticky; top: 0; z-index: 20;
    margin: 20px -12px 0; padding: 12px 12px 10px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    border-radius: 0 0 10px 10px;
  }
  .toolbar-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button, input, select { font: inherit; }
  #q {
    flex: 1 1 180px; min-width: 130px; padding: 8px 12px;
    border: 1px solid var(--border); border-radius: 10px;
    background: var(--surface); color: var(--text-1); outline: none;
  }
  #q:focus { border-color: var(--text-3); }
  #week, #mark {
    padding: 8px 12px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--surface); color: var(--text-1);
  }
  #count { font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; margin-left: auto; }
  #toggle {
    padding: 6px 12px; font-size: 12px; cursor: pointer;
    border: 1px solid var(--border); border-radius: 999px;
    background: transparent; color: var(--text-3);
  }
  #toggle:hover { color: var(--text-1); border-color: var(--text-3); }

  .filters { margin-top: 10px; }
  .filters.hide { display: none; }
  .filter-block { display: flex; align-items: flex-start; gap: 8px; margin-top: 8px; }
  .filter-block:first-child { margin-top: 0; }
  .filter-label { flex: 0 0 52px; font-size: 12px; color: var(--text-3); padding-top: 5px; margin: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; }
  .chip {
    padding: 3px 11px; font-size: 12.5px; cursor: pointer;
    border: 1px solid var(--border); border-radius: 999px;
    background: transparent; color: var(--text-2); line-height: 1.5;
  }
  .chip:hover { border-color: var(--text-3); color: var(--text-1); }
  .chip[aria-pressed="true"] { background: var(--text-1); color: var(--surface); border-color: var(--text-1); }
  .chip .cnt { font-size: 11px; color: var(--text-4); margin-left: 3px; font-variant-numeric: tabular-nums; }
  .chip[aria-pressed="true"] .cnt { color: var(--surface); opacity: .7; }

  .weeknav { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 18px; }
  .weeknav a {
    font-size: 12.5px; text-decoration: none; color: var(--text-2);
    border: 1px solid var(--border); border-radius: 999px; padding: 3px 11px;
    font-variant-numeric: tabular-nums;
  }
  .weeknav a:hover { color: var(--text-1); border-color: var(--text-3); }
  .weeknav .n { color: var(--text-4); font-size: 11px; margin-left: 2px; }

  .week-head {
    display: flex; align-items: baseline; gap: 10px;
    margin-top: 30px; padding: 6px 10px;
    border-left: 3px solid var(--text-1);
    background: var(--surface-mute);
    border-radius: 0 6px 6px 0;
    scroll-margin-top: 200px;
  }
  .week-head .w { font-size: 15.5px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .week-head .n { font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .week-head .rep { margin-left: auto; font-size: 12px; color: var(--accent); text-decoration: none; }
  .week-head .rep:hover { text-decoration: underline; }

  .entry {
    padding: 14px 10px 12px; border-bottom: 1px solid var(--border);
    border-radius: 6px; transition: background .15s ease, opacity .15s ease;
  }
  .entry:hover { background: var(--surface-mute); }
  .entry.is-read { opacity: .5; }
  .entry.is-read:hover { opacity: .85; }
  .entry:last-child { border-bottom: none; }
  .line1 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; }
  .t { font-size: 15px; line-height: 1.5; font-weight: 500; }
  .cat {
    flex: 0 0 auto; font-size: 12px; line-height: 18px; padding: 0 8px;
    border-radius: 6px; white-space: nowrap; align-self: center;
  }
  .cat-must  { color: var(--accent);   background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .cat-read  { color: var(--positive); background: color-mix(in srgb, var(--positive) 14%, transparent); }
  .cat-watch { color: var(--warning);  background: color-mix(in srgb, var(--warning) 16%, transparent); }
  .cat-hist  { color: var(--purple);   background: color-mix(in srgb, var(--purple) 13%, transparent); }
  .cat-other { color: var(--text-3);   background: color-mix(in srgb, var(--text-3) 14%, transparent); }

  .idline { margin-top: 5px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  code {
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    font-size: 12px; color: var(--text-2);
    background: var(--surface-mute); padding: 1px 6px; border-radius: 4px;
  }
  .entry:hover code { background: var(--border); }
  a.idlink { text-decoration: none; }
  a.idlink code { border-bottom: 1px dashed var(--text-4); }
  a.idlink:hover code { color: var(--text-1); border-bottom-color: var(--text-1); }
  .dt { font-size: 12px; color: var(--text-4); font-variant-numeric: tabular-nums; }
  .disp { margin-top: 5px; font-size: 13px; line-height: 1.55; color: var(--text-2); }

  .marks { display: inline-flex; gap: 4px; margin-left: auto; }
  .mark-btn {
    font-size: 11.5px; line-height: 1.4; padding: 2px 8px; cursor: pointer;
    border: 1px solid var(--border); border-radius: 999px;
    background: transparent; color: var(--text-4);
  }
  .mark-btn:hover { color: var(--text-1); border-color: var(--text-3); }
  .mark-btn.on-star { color: var(--warning); border-color: var(--warning); }
  .mark-btn.on-read { color: var(--positive); border-color: var(--positive); }

  .det { margin-top: 6px; }
  .det summary {
    display: inline-block; cursor: pointer; list-style: none;
    font-size: 12px; color: var(--accent);
  }
  .det summary::-webkit-details-marker { display: none; }
  .det summary::before { content: "▸ "; }
  .det[open] summary::before { content: "▾ "; }
  .det summary:hover { text-decoration: underline; }
  .det-body {
    margin-top: 6px; padding: 10px 12px;
    font-size: 13px; line-height: 1.6; color: var(--text-2);
    background: var(--surface-mute); border-radius: 6px;
  }

  .tags { margin-top: 7px; display: flex; flex-wrap: wrap; gap: 4px; }
  .tag {
    font-size: 11px; line-height: 1.5; padding: 1px 8px; cursor: pointer;
    border: 1px solid transparent; border-radius: 6px; background: transparent;
  }
  .tag-d { color: var(--accent); background: color-mix(in srgb, var(--accent) 9%, transparent); }
  .tag-d:hover { background: color-mix(in srgb, var(--accent) 18%, transparent); }
  .tag-m { color: var(--purple); background: color-mix(in srgb, var(--purple) 9%, transparent); }
  .tag-m:hover { background: color-mix(in srgb, var(--purple) 18%, transparent); }
  .tag.on { border-color: currentColor; font-weight: 500; }

  .empty { padding: 56px 0; text-align: center; color: var(--text-3); font-size: 14px; }
  .foot { margin-top: 40px; font-size: 12px; color: var(--text-4); line-height: 1.6; }

  #top {
    position: fixed; right: 20px; bottom: 20px; z-index: 30;
    padding: 8px 14px; font-size: 12px; cursor: pointer;
    border: 1px solid var(--border); border-radius: 999px;
    background: var(--surface); color: var(--text-2);
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    opacity: 0; pointer-events: none; transition: opacity .2s ease;
  }
  #top.show { opacity: 1; pointer-events: auto; }
  #top:hover { color: var(--text-1); border-color: var(--text-3); }

  @media (max-width: 640px) {
    .week-head { scroll-margin-top: 240px; }
    .filter-label { flex-basis: 44px; }
    .marks { margin-left: 0; }
  }
</style>
</head>

<script>
var REPORTS = {"2026-09-30": "reports/weekly_2026-09-30.html", "2026-10-05": "reports/weekly_2026-10-05.html", "2026-10-12": "reports/weekly_2026-10-12.html", "2026-10-19": "reports/weekly_2026-10-19.html", "2026-10-26": "reports/weekly_2026-10-26.html", "2026-11-02": "reports/weekly_2026-11-02.html"};
(function () {
  var DATA = JSON.parse(document.getElementById('radar-data').textContent);
  var CAT_ORDER = ['必读', '可读', '观察', '历史补课', '其他', '忽略'];
  var CAT_CLASS = { '必读': 'cat-must', '可读': 'cat-read', '观察': 'cat-watch', '历史补课': 'cat-hist', '其他': 'cat-other', '忽略': 'cat-other' };
  var DIR_ORDER = ['活性与动力学','热稳定性','溶解度与表达','耐受与转运','选择性与特异性','新酶与新功能设计','通路组装与产量','结构与构象','底物结合与口袋','功能注释与预测','基准与方法学'];
  var METH_ORDER = ['AI/ML 模型','物理模拟','定向进化与筛选','理性与半理性设计','实验表征','数据库与工具','综述与批评'];
  var state = { q: '', cat: '全部', week: '全部', dir: '全部', meth: '全部', mark: '全部' };

  // ---- marks (localStorage) ----
  var MKEY = 'radar-marks-v1';
  var marks = {};
  try { marks = JSON.parse(localStorage.getItem(MKEY) || '{}'); } catch (e) { marks = {}; }
  function saveMarks() { try { localStorage.setItem(MKEY, JSON.stringify(marks)); } catch (e) {} }

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function linkFor(id) {
    var m = id.match(/arXiv:(\S+)/i);
    if (m) return 'https://arxiv.org/abs/' + m[1].replace(/[，。（）()、\s].*$/, '');
    if (/^\d{4}\.\d{4,5}$/.test(id)) return 'https://arxiv.org/abs/' + id;
    m = id.match(/^(?:PubMed|PMID)[:\s]*(\d{6,9})/i);
    if (m) return 'https://pubmed.ncbi.nlm.nih.gov/' + m[1] + '/';
    m = id.match(/^(PMC\d{5,9})/i);
    if (m) return 'https://www.ncbi.nlm.nih.gov/pmc/articles/' + m[1] + '/';
    m = id.match(/preprints\.org\s*(\d{6}\.\d{4,5})/i);
    if (m) return 'https://www.preprints.org/manuscript/' + m[1];
    m = id.match(/^(rs-\d{6,9})/i);
    if (m) return 'https://www.researchsquare.com/article/' + m[1] + '/v1';
    m = id.match(/^Zenodo\s*(\d{5,9})/i);
    if (m) return 'https://doi.org/10.5281/zenodo.' + m[1];
    m = id.match(/^ScienceDirect\s*(S\d{15,17})/i);
    if (m) return 'https://www.sciencedirect.com/science/article/pii/' + m[1];
    var first = id.split(/[\s（(]/)[0];
    if (/^10\.\d{4,}\/\S+$/.test(first)) return 'https://doi.org/' + first;
    return null;
  }
  function count(listKey, key) {
    var n = 0;
    DATA.forEach(function (e) { if ((listKey === 'cat' ? [e.cat] : e[listKey]).indexOf(key) !== -1) n++; });
    return n;
  }

  // ---- stats ----
  var weeks = {}, must = 0;
  DATA.forEach(function (e) { weeks[e.week] = true; if (e.cat === '必读') must++; });
  var weekList = Object.keys(weeks).sort().reverse();
  document.getElementById('stats').innerHTML =
    '<span class="stat">共 <b>' + DATA.length + '</b> 条</span>' +
    '<span class="stat">必读 <b>' + must + '</b> 条</span>' +
    '<span class="stat">覆盖 <b>' + weekList.length + '</b> 期（' + weekList[weekList.length - 1] + ' ~ ' + weekList[0] + '）</span>';

  var sel = document.getElementById('week');
  sel.innerHTML = '<option value="全部">全部周期</option>' + weekList.map(function (w) {
    return '<option value="' + esc(w) + '">' + esc(w) + ' 期</option>';
  }).join('');
  sel.addEventListener('change', function () { state.week = sel.value; render(); });

  document.getElementById('mark').addEventListener('change', function (ev) {
    state.mark = ev.target.value; render();
  });

  document.getElementById('weeknav').innerHTML = weekList.map(function (w) {
    var n = DATA.filter(function (e) { return e.week === w; }).length;
    return '<a href="#w-' + w + '">' + w.slice(5) + '<span class="n">' + n + '</span></a>';
  }).join('');

  var tg = document.getElementById('toggle'), fl = document.getElementById('filters');
  tg.addEventListener('click', function () {
    var hidden = fl.classList.toggle('hide');
    tg.textContent = hidden ? '展开筛选' : '收起筛选';
    tg.setAttribute('aria-expanded', String(!hidden));
  });

  function buildChips(elId, names, dim, listKey) {
    var el = document.getElementById(elId);
    var all = ['全部'].concat(names.filter(function (n) {
      return DATA.some(function (e) { return (listKey === 'cat' ? [e.cat] : e[listKey]).indexOf(n) !== -1; });
    }));
    el.innerHTML = all.map(function (n) {
      var cnt = n === '全部' ? '' : '<span class="cnt">' + count(listKey, n) + '</span>';
      return '<button class="chip" aria-pressed="' + (n === '全部') + '" data-v="' + esc(n) + '">' + esc(n) + cnt + '</button>';
    }).join('');
    el.addEventListener('click', function (ev) {
      var b = ev.target.closest('button[data-v]');
      if (!b) return;
      setFilter(dim, b.getAttribute('data-v'));
    });
  }
  function setFilter(dim, v) {
    state[dim] = (state[dim] === v) ? '全部' : v;
    syncChips();
    render();
  }
  function syncChips() {
    [['cats', 'cat'], ['dirs', 'dir'], ['meths', 'meth']].forEach(function (p) {
      document.getElementById(p[0]).querySelectorAll('button').forEach(function (x) {
        x.setAttribute('aria-pressed', String(x.getAttribute('data-v') === state[p[1]]));
      });
    });
  }
  buildChips('cats', CAT_ORDER, 'cat', 'cat');
  buildChips('dirs', DIR_ORDER, 'dir', 'dirs');
  buildChips('meths', METH_ORDER, 'meth', 'meths');

  document.getElementById('q').addEventListener('input', function (ev) {
    state.q = ev.target.value.trim().toLowerCase();
    render();
  });

  function match(e) {
    if (state.cat !== '全部' && e.cat !== state.cat) return false;
    if (state.week !== '全部' && e.week !== state.week) return false;
    if (state.dir !== '全部' && e.dirs.indexOf(state.dir) === -1) return false;
    if (state.meth !== '全部' && e.meths.indexOf(state.meth) === -1) return false;
    if (state.mark === '精读' && !(marks[e.id] && marks[e.id].star)) return false;
    if (state.mark === '未读' && (marks[e.id] && marks[e.id].read)) return false;
    if (state.q) {
      var hay = (e.title + ' ' + e.id + ' ' + e.disp + ' ' + (e.detail || '') + ' ' + e.dirs.join(' ') + ' ' + e.meths.join(' ')).toLowerCase();
      if (hay.indexOf(state.q) === -1) return false;
    }
    return true;
  }

  function tagHtml(e) {
    var h = '<div class="tags">';
    e.dirs.forEach(function (t) {
      h += '<button class="tag tag-d' + (state.dir === t ? ' on' : '') + '" data-dim="dir" data-tag="' + esc(t) + '">' + esc(t) + '</button>';
    });
    e.meths.forEach(function (t) {
      h += '<button class="tag tag-m' + (state.meth === t ? ' on' : '') + '" data-dim="meth" data-tag="' + esc(t) + '">' + esc(t) + '</button>';
    });
    return h + '</div>';
  }

  var listEl = document.getElementById('list');
  listEl.addEventListener('click', function (ev) {
    var b = ev.target.closest('button.tag');
    if (b) { setFilter(b.getAttribute('data-dim'), b.getAttribute('data-tag')); return; }
    var mb = ev.target.closest('button.mark-btn');
    if (mb) {
      var id = mb.getAttribute('data-id'), kind = mb.getAttribute('data-kind');
      marks[id] = marks[id] || {};
      marks[id][kind] = !marks[id][kind];
      if (!marks[id].star && !marks[id].read) delete marks[id];
      saveMarks();
      render();
    }
  });

  function render() {
    var groups = [], byWeek = {}, shown = 0;
    DATA.forEach(function (e) {
      if (!match(e)) return;
      shown++;
      if (!byWeek[e.week]) { byWeek[e.week] = []; groups.push(e.week); }
      byWeek[e.week].push(e);
    });
    groups.sort().reverse();

    var filtered = state.q || state.cat !== '全部' || state.week !== '全部' || state.dir !== '全部' || state.meth !== '全部' || state.mark !== '全部';
    document.getElementById('count').textContent = filtered ? '筛选出 ' + shown + ' / ' + DATA.length + ' 条' : '';

    if (!groups.length) {
      listEl.innerHTML = '<div class="empty">没有匹配的条目，试试放宽筛选条件。</div>';
      return;
    }
    var html = '';
    groups.forEach(function (w) {
      var items = byWeek[w];
      var rep = REPORTS[w] ? '<a class="rep" href="' + REPORTS[w] + '">当期周报 →</a>' : '';
      html += '<div class="week-head" id="w-' + w + '"><span class="w">' + esc(w) + ' 期</span><span class="n">' + items.length + ' 条</span>' + rep + '</div>';
      items.forEach(function (e) {
        var url = linkFor(e.id);
        var inner = '<code>' + esc(e.id) + '</code>';
        var idHtml = url
          ? '<a class="idlink" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + inner + '</a>'
          : inner;
        var mk = marks[e.id] || {};
        var markHtml = '<span class="marks">' +
          '<button class="mark-btn' + (mk.star ? ' on-star' : '') + '" data-id="' + esc(e.id) + '" data-kind="star" title="精读标记">' + (mk.star ? '★' : '☆') + ' 精读</button>' +
          '<button class="mark-btn' + (mk.read ? ' on-read' : '') + '" data-id="' + esc(e.id) + '" data-kind="read" title="已读标记">✓ 已读</button>' +
          '</span>';
        var detHtml = e.detail
          ? '<details class="det"><summary>详情</summary><div class="det-body">' + esc(e.detail) + '</div></details>'
          : '';
        html += '<div class="entry' + (mk.read ? ' is-read' : '') + '">' +
          '<div class="line1"><span class="cat ' + (CAT_CLASS[e.cat] || 'cat-other') + '">' + esc(e.cat) + '</span>' +
          '<span class="t">' + esc(e.title) + '</span></div>' +
          '<div class="idline">' + idHtml + '<span class="dt">收录 ' + esc(e.date) + '</span>' + markHtml + '</div>' +
          '<div class="disp">' + esc(e.disp) + '</div>' +
          detHtml +
          tagHtml(e) +
          '</div>';
      });
    });
    listEl.innerHTML = html;
  }

  var topBtn = document.getElementById('top');
  window.addEventListener('scroll', function () {
    topBtn.classList.toggle('show', window.scrollY > 600);
  }, { passive: true });
  topBtn.addEventListener('click', function () { window.scrollTo({ top: 0, behavior: 'smooth' }); });

  render();
})();
</script>
</body>
